name: Build HakoMac DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HakoMac DMG
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show environment
        run: |
          sw_vers
          echo "Xcode:"
          xcodebuild -version
          echo "Swift:"
          swift --version
          echo "Python:"
          python3 --version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Verify Go
        run: |
          which go
          go version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version

      - name: Setup Python
        shell: bash
        run: |
          set -e

          mkdir -p .build

          python3 -m venv .build/python-env

          source .build/python-env/bin/activate

          python3 -m pip install --upgrade pip
          python3 -m pip install PyYAML

          python3 --version
          python3 -m pip show PyYAML

      - name: Bootstrap dependencies
        shell: bash
        run: |
          set -e

          source .build/python-env/bin/activate

          python3 scripts/bootstrap.py

      - name: Configure project
        shell: bash
        run: |
          set -e

          source .build/python-env/bin/activate

          python3 scripts/configure.py

      - name: Verify Xcode project
        shell: bash
        run: |
          set -e

          PROJECT="apple/HakoClient/HakoClient.xcodeproj"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: Xcode project not found:"
            echo "$PROJECT"
            echo ""
            echo "Available projects:"
            find . -name "*.xcodeproj" -type d -print
            exit 1
          fi

          echo "Project:"
          echo "$PROJECT"

          echo ""
          echo "Available schemes:"

          xcodebuild \
            -project "$PROJECT" \
            -list

      - name: Build HakoMac
        shell: bash
        run: |
          set -o pipefail

          PROJECT="apple/HakoClient/HakoClient.xcodeproj"

          rm -rf build
          mkdir -p build

          echo "======================================"
          echo "Building HakoMac"
          echo "======================================"

          xcodebuild \
            -project "$PROJECT" \
            -scheme HakoMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            2>&1 | tee build/xcodebuild.log

          BUILD_RESULT=${PIPESTATUS[0]}

          echo ""
          echo "Xcode build exit code: $BUILD_RESULT"

          if [ "$BUILD_RESULT" -ne 0 ]; then
            echo ""
            echo "======================================"
            echo "XCODE ERRORS"
            echo "======================================"

            grep -nE \
              '(^|[[:space:]])error:|SwiftCompile failed|CompileSwift|Ld .* failed|CodeSign .* failed|Undefined symbols|No such module' \
              build/xcodebuild.log \
              | tail -n 100 || true

            echo ""
            echo "======================================"
            echo "LAST 200 LOG LINES"
            echo "======================================"

            tail -n 200 build/xcodebuild.log

            exit "$BUILD_RESULT"
          fi

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HakoMac-Xcode-Build-Log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Locate HakoMac.app
        shell: bash
        run: |
          set -e

          APP_PATH=$(find \
            build/DerivedData/Build/Products \
            -type d \
            -name "HakoMac.app" \
            -print \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: HakoMac.app not found."

            echo ""
            echo "Build products:"
            find \
              build/DerivedData/Build/Products \
              -maxdepth 5 \
              -print

            exit 1
          fi

          echo "Found:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Read app version
        shell: bash
        run: |
          set -e

          VERSION=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$APP_PATH/Contents/Info.plist" \
              2>/dev/null || echo "dev"
          )

          BUILD_NUMBER=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$APP_PATH/Contents/Info.plist" \
              2>/dev/null || echo "0"
          )

          echo "Version: $VERSION"
          echo "Build: $BUILD_NUMBER"

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Prepare DMG
        shell: bash
        run: |
          set -e

          rm -rf build/dmg
          mkdir -p build/dmg

          cp -R \
            "$APP_PATH" \
            "build/dmg/HakoMac.app"

          ln -s \
            /Applications \
            "build/dmg/Applications"

          echo ""
          echo "DMG contents:"
          ls -lah build/dmg

      - name: Create DMG
        shell: bash
        run: |
          set -e

          DMG_NAME="HakoMac-${APP_VERSION}-${BUILD_NUMBER}.dmg"

          echo "Creating:"
          echo "$DMG_NAME"

          hdiutil create \
            -volname "HakoMac" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "build/$DMG_NAME"

          if [ ! -f "build/$DMG_NAME" ]; then
            echo "ERROR: DMG was not created."
            exit 1
          fi

          ls -lh "build/$DMG_NAME"

          echo "DMG_PATH=build/$DMG_NAME" >> "$GITHUB_ENV"

      - name: Verify DMG
        run: |
          set -e

          hdiutil imageinfo "$DMG_PATH"

          echo ""
          echo "DMG:"
          ls -lh "$DMG_PATH"

      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          SHA_FILE="${DMG_PATH}.sha256"

          shasum -a 256 \
            "$DMG_PATH" \
            > "$SHA_FILE"

          echo ""
          echo "SHA256:"
          cat "$SHA_FILE"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: HakoMac-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.DMG_PATH }}.sha256
          if-no-files-found: error
          retention-days: 30
