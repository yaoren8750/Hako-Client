name: Build HakoMac DMG

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HakoMac DMG
    runs-on: macos-15

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # 2. Show system information
      # ==================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "System"
          echo "======================================"

          sw_vers

          echo
          echo "======================================"
          echo "Xcode"
          echo "======================================"

          xcodebuild -version

          echo
          echo "======================================"
          echo "Swift"
          echo "======================================"

          swift --version

          echo
          echo "======================================"
          echo "Python"
          echo "======================================"

          python3 --version

          echo
          echo "======================================"
          echo "Git"
          echo "======================================"

          git --version


      # ==================================================
      # 3. Install Go
      # ==================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false


      # ==================================================
      # 4. Verify Go
      # ==================================================
      - name: Verify Go
        shell: bash
        run: |
          set -e

          echo "Go location:"
          which go

          echo
          echo "Go version:"
          go version


      # ==================================================
      # 5. Install XcodeGen
      # ==================================================
      - name: Install XcodeGen
        shell: bash
        run: |
          set -e

          brew install xcodegen

          echo
          echo "XcodeGen:"
          xcodegen version


      # ==================================================
      # 6. Setup Python environment
      # ==================================================
      - name: Setup Python environment
        shell: bash
        run: |
          set -e

          mkdir -p .build

          python3 -m venv .build/python-env

          source .build/python-env/bin/activate

          python3 -m pip install --upgrade pip

          python3 -m pip install PyYAML

          echo
          echo "Python:"
          python3 --version

          echo
          echo "PyYAML:"
          python3 -m pip show PyYAML


      # ==================================================
      # 7. Bootstrap project dependencies
      # ==================================================
      - name: Bootstrap dependencies
        shell: bash
        run: |
          set -e

          source .build/python-env/bin/activate

          echo "Running bootstrap.py..."

          python3 scripts/bootstrap.py


      # ==================================================
      # 8. Configure / generate Xcode project
      # ==================================================
      - name: Configure project
        shell: bash
        run: |
          set -e

          source .build/python-env/bin/activate

          echo "Running configure.py..."

          python3 scripts/configure.py


      # ==================================================
      # 9. Verify generated Xcode project
      # ==================================================
      - name: Verify Xcode project
        shell: bash
        run: |
          set -e

          PROJECT="apple/HakoClient/HakoClient.xcodeproj"

          echo "Checking project..."

          if [ ! -d "$PROJECT" ]; then
            echo
            echo "ERROR: Xcode project was not generated."
            echo
            echo "Searching for Xcode projects:"
            find . \
              -name "*.xcodeproj" \
              -type d \
              -print

            exit 1
          fi

          echo
          echo "Xcode project:"
          echo "$PROJECT"

          echo
          echo "Available schemes:"

          xcodebuild \
            -project "$PROJECT" \
            -list


      # ==================================================
      # 10. Build HakoMac
      # ==================================================
      - name: Build HakoMac
        shell: bash
        run: |
          set -e

          PROJECT="apple/HakoClient/HakoClient.xcodeproj"

          rm -rf build

          mkdir -p build

          echo "======================================"
          echo "Building HakoMac"
          echo "======================================"

          xcodebuild \
            -project "$PROJECT" \
            -scheme HakoMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build


      # ==================================================
      # 11. Locate HakoMac.app
      # ==================================================
      - name: Locate HakoMac.app
        shell: bash
        run: |
          set -e

          echo "Searching for HakoMac.app..."

          APP_PATH=$(find \
            build/DerivedData/Build/Products \
            -type d \
            -name "HakoMac.app" \
            -print \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then

            echo
            echo "======================================"
            echo "ERROR: HakoMac.app not found"
            echo "======================================"

            echo
            echo "Build products:"

            find \
              build/DerivedData/Build/Products \
              -maxdepth 5 \
              -print

            exit 1
          fi

          echo
          echo "Found application:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"


      # ==================================================
      # 12. Display app information
      # ==================================================
      - name: Inspect application
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Application"
          echo "======================================"

          ls -lah "$APP_PATH"

          echo
          echo "Info.plist:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Contents/Info.plist" \
            2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Contents/Info.plist" \
            2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP_PATH/Contents/Info.plist" \
            2>/dev/null || true


      # ==================================================
      # 13. Read application version
      # ==================================================
      - name: Read application version
        shell: bash
        run: |
          set -e

          VERSION=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$APP_PATH/Contents/Info.plist" \
              2>/dev/null || echo "dev"
          )

          BUILD_NUMBER=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$APP_PATH/Contents/Info.plist" \
              2>/dev/null || echo "0"
          )

          echo "Application version: $VERSION"
          echo "Build number: $BUILD_NUMBER"

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"


      # ==================================================
      # 14. Prepare DMG
      # ==================================================
      - name: Prepare DMG
        shell: bash
        run: |
          set -e

          rm -rf build/dmg

          mkdir -p build/dmg

          echo "Copying application..."

          cp -R \
            "$APP_PATH" \
            "build/dmg/HakoMac.app"

          echo "Creating Applications shortcut..."

          ln -s \
            /Applications \
            "build/dmg/Applications"

          echo
          echo "DMG contents:"

          ls -lah build/dmg


      # ==================================================
      # 15. Create DMG
      # ==================================================
      - name: Create DMG
        shell: bash
        run: |
          set -e

          DMG_NAME="HakoMac-${APP_VERSION}-${BUILD_NUMBER}.dmg"

          echo "======================================"
          echo "Creating DMG"
          echo "======================================"

          hdiutil create \
            -volname "HakoMac" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "build/$DMG_NAME"

          if [ ! -f "build/$DMG_NAME" ]; then
            echo "ERROR: DMG creation failed."
            exit 1
          fi

          echo
          echo "DMG created successfully:"

          ls -lh "build/$DMG_NAME"

          echo "DMG_PATH=build/$DMG_NAME" >> "$GITHUB_ENV"


      # ==================================================
      # 16. Verify DMG
      # ==================================================
      - name: Verify DMG
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Verifying DMG"
          echo "======================================"

          hdiutil imageinfo "$DMG_PATH"

          echo
          echo "DMG file:"

          ls -lh "$DMG_PATH"


      # ==================================================
      # 17. Generate SHA256
      # ==================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          SHA_FILE="${DMG_PATH}.sha256"

          shasum -a 256 \
            "$DMG_PATH" \
            > "$SHA_FILE"

          echo
          echo "SHA256:"
          cat "$SHA_FILE"


      # ==================================================
      # 18. Upload DMG artifact
      # ==================================================
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: HakoMac-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.DMG_PATH }}.sha256
          if-no-files-found: error
          retention-days: 30
